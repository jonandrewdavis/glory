name: "Web and PlayFlow Export"
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7
  EXPORT_NAME: glory
  ITCH_USER: androodev
  ITCH_GAME: glory

jobs:
  export-web:
    name: Web Export
    runs-on: ubuntu-24.04
    container:
      image: davcri/godot-game-template-ci:4.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Configure PlayFlow client
        env:
          PLAYFLOW_CLIENT_KEY: ${{ secrets.PLAYFLOW_CLIENT_KEY }}
        # The CI image has no python3; this mirrors tools/configure_playflow_client.py.
        run: |
          case "$PLAYFLOW_CLIENT_KEY" in
            pfclient_*) ;;
            *) echo 'PLAYFLOW_CLIENT_KEY must be a client key (pfclient_...).' >&2; exit 1 ;;
          esac
          cat > networking/playflow_config.tres <<EOF
          [gd_resource type="Resource" load_steps=2 format=3]

          [ext_resource type="Script" path="res://networking/playflow_config.gd" id="1"]

          [resource]
          script = ExtResource("1")
          client_key = "$PLAYFLOW_CLIENT_KEY"
          EOF
      - name: Import project
        run: godot --headless --editor --import
      - name: Web Build
        run: |
          mkdir -v -p builds/web
          godot -v --headless --export-release "Web" ./builds/web/index.html
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: builds/web
          retention-days: 1
      - name: Build PlayFlow server ZIP
        run: bash tools/prepare_playflow.sh
      - name: Upload PlayFlow server
        uses: actions/upload-artifact@v4
        with:
          name: playflow-server
          path: builds/playflow-server.zip
          retention-days: 7
      - name: Zip Folder
        run: cd builds/web && zip -r ../../itch.zip .
      - name: Deploy to itch.io
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          ITCH_GAME: ${{ env.ITCH_GAME }}
          ITCH_USER: ${{ env.ITCH_USER }}
          PACKAGE: itch.zip
